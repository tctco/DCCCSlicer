name: Publish DCCC website

on:
  push:
    branches: [website]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
      - 'scripts/build-website-locales.py'
      - 'scripts/website_acknowledgements.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/website'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout website branch
        uses: actions/checkout@v6
      - name: Generate Chinese homepage
        run: python3 scripts/build-website-locales.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
